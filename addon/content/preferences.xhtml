<vbox id="opendata-cite-prefs" onload="">
	<groupbox>
		<label data-l10n-id="opendata-cite-pref-date-label"/>
		<radiogroup id="opendata-cite-date-source" preference="extensions.opendata-cite.dateSource">
			<radio value="dataUpdated" data-l10n-id="opendata-cite-pref-date-data-updated"/>
			<radio value="metadataUpdated" data-l10n-id="opendata-cite-pref-date-metadata-updated"/>
			<radio value="published" data-l10n-id="opendata-cite-pref-date-published"/>
			<radio value="created" data-l10n-id="opendata-cite-pref-date-created"/>
		</radiogroup>
	</groupbox>
	<groupbox>
		<checkbox id="opendata-cite-create-note" preference="extensions.opendata-cite.createNote"
			data-l10n-id="opendata-cite-pref-create-note"/>
	</groupbox>
</vbox>
